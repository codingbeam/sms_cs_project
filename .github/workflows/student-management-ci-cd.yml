name: Student Management CI/CD

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore application
        run: dotnet restore StudentManagementConsoleApplication.csproj

      - name: Build application
        run: dotnet build StudentManagementConsoleApplication.csproj --configuration Release --no-restore

      - name: Publish application
        if: github.event_name != 'pull_request'
        run: dotnet publish StudentManagementConsoleApplication.csproj --configuration Release --no-build --output ./publish

      - name: Upload published application
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: student-management-console-publish
          path: ./publish/
